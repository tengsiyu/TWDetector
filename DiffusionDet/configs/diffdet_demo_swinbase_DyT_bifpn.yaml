_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "../checkpoints/twdetector_sample_step_16.pth"
  BACKBONE:
    NAME: build_swintransformer_DyT_bifpn_backbone
  SWIN:
    SIZE: B-22k
  FPN:
    IN_FEATURES: ["swin0", "swin1", "swin2", "swin3" ]
  DiffusionDet:
    NUM_PROPOSALS: 100
    NUM_CLASSES: 3
    SAMPLE_STEP: 16
DATASETS:
  TRAIN: ("coco_my_train",)
  TEST:  ("coco_my_val",)
SOLVER:
  IMS_PER_BATCH: 1
  STEPS: (35400, 42450)
  MAX_ITER: 45500
#  STEPS: (420000, 500000)
#  MAX_ITER: 540000
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
OUTPUT_DIR: ./OUTPUT/diffdet_swin_base_DyT_bifpn_sample_step_16
